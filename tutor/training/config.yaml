# Training configuration for QLoRA fine-tuning on free Colab / Kaggle GPU
# Recommended base model: Qwen/Qwen2.5-Math-1.5B-Instruct or Qwen/Qwen2.5-1.5B-Instruct

model:
  base_model_name: "Qwen/Qwen2.5-Math-1.5B-Instruct"
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true
  device_map: "auto"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "models/qwen2.5-math-tutor-lora"
  dataset_train_path: "tutor/data/processed/train.jsonl"
  dataset_val_path: "tutor/data/processed/val.jsonl"
  max_seq_length: 512
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  num_train_epochs: 1
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 100
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  fp16: false
  bf16: true
  optim: "paged_adamw_8bit"
  seed: 42
